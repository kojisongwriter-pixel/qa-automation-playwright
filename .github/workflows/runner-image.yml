name: Runner image

# Builds, validates and publishes the AssureLayer four-browser runner image
# (runner-image/Dockerfile): daily, so it carries the latest stable Chrome and
# Edge, and on demand. A candidate is published only after its versions are
# recorded and all four browsers pass the smoke suite INSIDE it.
#
# Publishing never changes what client runs use: ci.yml pins an image by
# immutable digest, and a new digest reaches it only through a reviewed change.
# On main, this workflow proposes that change on its own branch
# (runner-image/update-<tag>) and opens a pull request when the repository
# allows GitHub Actions to; it never pushes to main.

on:
  push:
    branches: [validate/image-pw165]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, validate and publish the runner image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # GITHUB_TOKEN only: contents (push the proposal branch, never main),
    # packages (publish to ghcr.io), pull-requests (open the proposal).
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/assurelayer-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build candidate image
        id: build
        run: |
          tag="$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          docker build --pull \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            -t "$IMAGE:$tag" runner-image
          docker image inspect --format 'size={{.Size}}' "$IMAGE:$tag"

      - name: Record image contents
        run: docker run --rm "$IMAGE:${{ steps.build.outputs.tag }}" cat /etc/assurelayer-runner-image.json | tee runner-image.json

      # The candidate must run this repository's smoke suite in all four browsers,
      # exactly as a dispatched run does, before it can be published.
      - name: Four-browser smoke test in the candidate image
        run: |
          docker run --rm --ipc=host \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CI=true -e NODE_AUTH_TOKEN -e ENV -e ASSURELAYER_SUITE -e ASSURELAYER_BROWSERS \
            -e ASSURELAYER_RUNNER_IMAGE="$IMAGE:${{ steps.build.outputs.tag }}" \
            "$IMAGE:${{ steps.build.outputs.tag }}" \
            bash -c 'npm ci && node scripts/assurelayer/verify-runner-image.js && npx playwright test'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ASSURELAYER_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          ENV: staging
          ASSURELAYER_SUITE: smoke
          ASSURELAYER_BROWSERS: chrome,msedge,firefox,webkit

      # Failure evidence in all four browsers: a test that fails ON PURPOSE against an
      # in-memory page (runner-image/evidence-check) must leave a screenshot, a video
      # and a retry trace per browser. Nothing is reported anywhere.
      - name: Failure evidence check in the candidate image
        run: |
          docker run --rm --ipc=host             -v "$GITHUB_WORKSPACE:/work" -w /work -e CI=true -e EVIDENCE_OUT=/work/evidence-check-output             "$IMAGE:${{ steps.build.outputs.tag }}"             bash -c 'npx playwright test -c runner-image/evidence-check/playwright.config.js; code=$?; if [ "$code" -ne 1 ]; then echo "expected the evidence test to fail (exit 1), got $code"; exit 1; fi; node runner-image/evidence-check/verify-evidence.js'

      # Every severity, fixable AND unfixed, with a pinned scanner and a fresh
      # database. Findings are report-only (job summary, the proposal and the
      # complete JSON report as an artifact) and do not block the daily build; a
      # scanner failure does, so nothing is published without a complete scan.
      - name: Vulnerability scan
        env:
          TRIVY: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # 0.76.1
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD:/out" "$TRIVY" \
            image --image-src docker --scanners vuln --timeout 30m --no-progress --exit-code 0 \
            --format json --output /out/trivy.json "$IMAGE:${{ steps.build.outputs.tag }}"
          docker run --rm -v trivy-cache:/root/.cache "$TRIVY" version --format json > trivy-version.json
          node runner-image/summarize-scan.js trivy.json trivy-version.json | tee trivy.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the complete scan report
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report-${{ steps.build.outputs.tag }}
          path: |
            trivy.json
            trivy-version.json
            runner-image.json
          retention-days: 90

      - name: Publish
        id: publish
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:${{ steps.build.outputs.tag }}"
          ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ steps.build.outputs.tag }}")"
          docker logout ghcr.io
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # Transfer size: what a run actually downloads (sum of the compressed layers).
          compressed="$(docker manifest inspect -v "$ref" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const m=j.OCIManifest||j.SchemaV2Manifest||j;const l=m.layers||[];console.log(l.reduce((a,x)=>a+x.size,0)+" bytes in "+l.length+" layers ("+l.map(x=>Math.round(x.size/1048576)+"MB").join(", ")+")")})')"
          docker logout ghcr.io
          { echo "### Published"; echo "tag: \`${{ steps.build.outputs.tag }}\`"; echo "image: \`$ref\`"; echo "compressed transfer: $compressed"; echo '```json'; cat runner-image.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "compressed=$compressed" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Retention, REPORT ONLY: lists published versions and marks the digest ci.yml
      # approves on main and the one before it. Nothing is ever deleted automatically.
      - name: Retention report
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: |
          git fetch --no-tags --depth=100 origin main || true
          approved="$(git show origin/main:.github/workflows/ci.yml 2>/dev/null | grep -oE "${IMAGE}@sha256:[0-9a-f]{64}" | head -1 || true)"
          previous="$(git log origin/main -p -- .github/workflows/ci.yml 2>/dev/null | grep -oE "^-.*${IMAGE}@sha256:[0-9a-f]{64}" | grep -oE 'sha256:[0-9a-f]{64}' | head -1 || true)"
          { echo "### Runner image retention (report only — nothing deleted)"; echo "approved on main: \`${approved:-none yet}\`"; echo "previous approved: \`${previous:-none}\`"; echo; echo "| version | tags | created |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/assurelayer-runner/versions?per_page=50"             --jq '.[] | "| \(.name) | \(.metadata.container.tags | join(", ")) | \(.created_at) |"' >> "$GITHUB_STEP_SUMMARY"             || echo "Package versions are not readable with this workflow's token; review them in the package settings." >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Scheduled/main builds only: propose the new digest for review.
      - name: Propose the new digest for review
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          branch="runner-image/update-${{ steps.build.outputs.tag }}"
          old="$(grep -oE "${IMAGE}@sha256:[0-9a-f]{64}" .github/workflows/ci.yml | head -1 || true)"
          sed -i -E "s#${IMAGE}@sha256:[0-9a-f]{64}#${REF}#g" .github/workflows/ci.yml
          if git diff --quiet; then echo "ci.yml does not reference the runner image; nothing to propose"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -am "ci: runner image ${{ steps.build.outputs.tag }}"
          git push origin "$branch"
          { echo "Runner image \`${{ steps.build.outputs.tag }}\` passed the four-browser smoke test, the failure-evidence check and the vulnerability scan (below)."; echo; echo "- current (approved): \`${old}\`"; echo "- proposed: \`${REF}\`"; echo "- compressed transfer: ${COMPRESSED}"; echo; echo '```json'; cat runner-image.json; echo '```'; echo; cat trivy.md; echo; echo "Merging this changes the image dispatched AssureLayer runs use. The current digest stays published for rollback."; } > pr-body.md
          gh pr create --base main --head "$branch" --title "ci: runner image ${{ steps.build.outputs.tag }}" --body-file pr-body.md \
            || echo "::warning::Could not open the pull request automatically (the repository does not allow GitHub Actions to create pull requests). Open one from branch $branch."
        env:
          REF: ${{ steps.publish.outputs.ref }}
          COMPRESSED: ${{ steps.publish.outputs.compressed }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
