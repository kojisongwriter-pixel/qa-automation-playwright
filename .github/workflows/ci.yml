name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assurelayer_run_id:
        description: "AssureLayer test_run id this execution is bound to (not a secret — just a correlation id)."
        required: false
        type: string
      # Derived by AssureLayer from the run's own environment / test-suite records
      # and sent as controlled values. `type: choice` makes GitHub itself refuse
      # anything outside these lists; scripts/assurelayer/resolve-scope.js
      # validates them again before any test runs.
      environment:
        description: "Target environment for this AssureLayer run (sets ENV)."
        required: false
        type: choice
        options:
          - staging
          - production
      suite:
        description: "Test suite for this AssureLayer run (selects the test directory)."
        required: false
        type: choice
        options:
          - smoke
          - regression
          - api
          - full
      # Browser projects for this run, as sent by AssureLayer from the project's
      # saved selection: a comma-separated subset of chrome, msedge, firefox,
      # webkit. Empty = all four (the default). Validated against that closed
      # list by scripts/assurelayer/resolve-scope.js before anything is installed.
      browsers:
        description: "Browser projects for this run (comma-separated: chrome, msedge, firefox, webkit). Empty = all four."
        required: false
        type: string

jobs:
  # Push / pull_request runs (and a plain manual dispatch). Dispatched runs use the
  # `assurelayer` job below (prebuilt runner image) — unless the repository variable
  # ASSURELAYER_RUNNER_IMAGE_DISABLED is 'true', which sends them back through this
  # job's per-run installation (rollback without a code change).
  test:
    name: Playwright Tests
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.assurelayer_run_id != '' || inputs.browsers != '') && vars.ASSURELAYER_RUNNER_IMAGE_DISABLED != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # id-token: write is required to request a GitHub Actions OIDC token
    # (used by the AssureLayer results callback below to prove this specific
    # job's identity without any pre-shared secret). contents: read is the
    # least-privilege default for checkout. packages: read is the ONLY extra
    # permission, needed because `npm ci` installs
    # @kojisongwriter-pixel/qa-platform-core from GitHub Packages using this
    # repository's GITHUB_TOKEN (an explicit `permissions:` block otherwise grants
    # it nothing). No other permission is granted.
    #
    # Package distribution (Prompt 6): an external client repository cannot read
    # AssureLayer's package with its own GITHUB_TOKEN, so AssureLayer issues each
    # client a read-only package credential, stored in the client repository as
    # the secret ASSURELAYER_PACKAGES_TOKEN. When that secret is absent (AssureLayer's
    # own repositories, which the package grants access), GITHUB_TOKEN is used.
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 26 (Active LTS): better-sqlite3 (a dependency of qa-platform-core)
      # ships a prebuilt Node 26 binary (ABI v147), so `npm ci` downloads it
      # instead of compiling SQLite from source as it did on Node 20, which has
      # no prebuilt binary (~60–90 s of the setup time on every run).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kojisongwriter-pixel'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ASSURELAYER_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # Push / pull_request (and a plain manual dispatch): the original single
      # bundled-Chromium installation, unchanged.
      - name: Install Playwright browsers
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.assurelayer_run_id != '' || inputs.browsers != '')) }}
        run: npx playwright install --with-deps chromium

      # Dispatched runs (AssureLayer, or an operator's cross-browser dispatch):
      # validate the environment/suite/browser inputs against the closed
      # allow-lists and export ENV + ASSURELAYER_SUITE + ASSURELAYER_BROWSERS to the
      # next steps. Inputs reach the script ONLY via env (never interpolated into
      # a shell command). Push / pull_request runs skip this step entirely.
      - name: Resolve AssureLayer execution scope
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.assurelayer_run_id != '' || inputs.browsers != '') }}
        run: node scripts/assurelayer/resolve-scope.js
        env:
          ASSURELAYER_ENVIRONMENT: ${{ inputs.environment }}
          ASSURELAYER_SUITE_INPUT: ${{ inputs.suite }}
          ASSURELAYER_BROWSERS_INPUT: ${{ inputs.browsers }}

      # Dispatched runs: install exactly the selected browsers (validated again;
      # no shell; branded Chrome / Edge installed explicitly). A failed install
      # fails the job before any test runs.
      - name: Install selected browsers
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.assurelayer_run_id != '' || inputs.browsers != '') }}
        run: node scripts/assurelayer/install-browsers.js

      # ASSURELAYER_RUN_ID is empty on push / pull_request, which leaves the
      # Playwright reporters (and every other behavior of this step) exactly as
      # they were. This step is NOT continue-on-error: a Playwright failure
      # fails the job regardless of what the callback step does afterwards.
      - name: Run tests
        id: tests
        run: npx playwright test
        env:
          ASSURELAYER_RUN_ID: ${{ inputs.assurelayer_run_id }}

      # AssureLayer callback: ONLY for workflow_dispatch executions started by
      # AssureLayer. `always()` makes it run even when Playwright failed (the
      # failure is what gets reported); it never changes that failure into a
      # success. Never runs on push or pull_request.
      - name: Report results to AssureLayer
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.assurelayer_run_id != '' }}
        run: node scripts/assurelayer-callback.js
        env:
          ASSURELAYER_RUN_ID: ${{ inputs.assurelayer_run_id }}
          ASSURELAYER_API_URL: ${{ vars.ASSURELAYER_API_URL }}
          ASSURELAYER_OIDC_AUDIENCE: ${{ vars.ASSURELAYER_OIDC_AUDIENCE }}
          PLAYWRIGHT_OUTCOME: ${{ steps.tests.outcome }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 30

  # Dispatched runs (AssureLayer, or an operator's cross-browser dispatch) in the
  # prebuilt four-browser runner image (runner-image/Dockerfile): Node.js, the
  # browsers' OS packages, Chrome, Edge, Firefox, WebKit and FFmpeg are already in
  # the image, so nothing is installed per run. The image is pinned by immutable
  # digest — in `container.image` and, identically, in ASSURELAYER_RUNNER_IMAGE —
  # and changes only through a reviewed change to this file
  # (.github/workflows/runner-image.yml proposes it). Same inputs, scope
  # resolution, tests, callback and artifacts as the `test` job.
  assurelayer:
    name: Playwright Tests (runner image)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.assurelayer_run_id != '' || inputs.browsers != '') && vars.ASSURELAYER_RUNNER_IMAGE_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/kojisongwriter-pixel/assurelayer-runner@sha256:2d443b86021e6590178c2f5de99f135fd133b896f4497782114524a1c7f03fdc
      # Pull with this run's own GITHUB_TOKEN (packages: read below); no other credential.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    # Same permissions as the `test` job, for the same reasons.
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      ASSURELAYER_RUNNER_IMAGE: ghcr.io/kojisongwriter-pixel/assurelayer-runner@sha256:2d443b86021e6590178c2f5de99f135fd133b896f4497782114524a1c7f03fdc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image's Node.js is used as is (the image check below enforces the
      # version); only the npm download cache is restored.
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-runner-image-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ASSURELAYER_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve AssureLayer execution scope
        run: node scripts/assurelayer/resolve-scope.js
        env:
          ASSURELAYER_ENVIRONMENT: ${{ inputs.environment }}
          ASSURELAYER_SUITE_INPUT: ${{ inputs.suite }}
          ASSURELAYER_BROWSERS_INPUT: ${{ inputs.browsers }}

      # Fails the run before any test when the image does not match this
      # repository (Node, Playwright, the selected browsers' revisions, FFmpeg),
      # and records the image's exact versions for the run's evidence.
      - name: Verify runner image
        run: node scripts/assurelayer/verify-runner-image.js

      # HOME=/root: the job container runs as root, and Firefox refuses to start
      # when $HOME (/github/home, owned by the runner user) belongs to another
      # user — Playwright's documented setting for GitHub Actions containers.
      - name: Run tests
        id: tests
        run: npx playwright test
        env:
          ASSURELAYER_RUN_ID: ${{ inputs.assurelayer_run_id }}
          HOME: /root

      - name: Report results to AssureLayer
        if: ${{ always() && inputs.assurelayer_run_id != '' }}
        run: node scripts/assurelayer-callback.js
        env:
          ASSURELAYER_RUN_ID: ${{ inputs.assurelayer_run_id }}
          ASSURELAYER_API_URL: ${{ vars.ASSURELAYER_API_URL }}
          ASSURELAYER_OIDC_AUDIENCE: ${{ vars.ASSURELAYER_OIDC_AUDIENCE }}
          PLAYWRIGHT_OUTCOME: ${{ steps.tests.outcome }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results/
            runner-image-record/
          retention-days: 30
